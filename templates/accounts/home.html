<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Warehouse Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-lg border-0 text-center p-4"
             style="max-width: 550px; width: 100%;">

            <div class="card-body">

                <h1 class="fw-bold text-primary mb-3">
                    Warehouse Management System
                </h1>

                <h5 class="text-secondary mb-4">
                    Welcome to WMS
                </h5>

                <p class="text-muted mb-4">
                    Manage your warehouse products, suppliers,
                    categories and inventory efficiently.
                </p>

                <div class="d-grid gap-3">

                    <a href="{% url 'register' %}"
                       class="btn btn-primary btn-lg">
                        Create an Account
                    </a>

                    <a href="{% url 'login' %}"
                       class="btn btn-outline-primary btn-lg">
                        Login
                    </a>

                </div>

                <hr class="my-4">

                <small class="text-muted">
                    &copy; {% now "Y" %} Warehouse Management System
                </small>

            </div>

        </div>

    </div>

</body>
</html>
